name: Oppdater stillinger

on:
  schedule:
    - cron: "17 4 * * *"   # hver natt ca. kl 06 norsk tid
  workflow_dispatch:        # "Run workflow"-knapp under Actions
  push:
    branches: [main]        # også når koden eller config.yaml endres

permissions:
  contents: write           # trengs for å skrive den ferdige siden til gh-pages-branchen

concurrency:
  group: update
  cancel-in-progress: true  # en ny kjøring erstatter en som henger

jobs:
  # Én jobb: hent → bygg → legg den ferdige siden på branchen gh-pages.
  # GitHub Pages viser siden derfra (Settings → Pages → Deploy from a branch → gh-pages).
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 1) Hent stillinger → frontend/public/jobs.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/main.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NAV_TOKEN: ${{ secrets.NAV_TOKEN }}

      # 2) Bygg nettsiden
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        working-directory: frontend

      # 3) Publiser: kopier frontend/dist til branchen gh-pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true   # bare siste versjon på branchen, ingen historikk som vokser