name: Oppdater stillinger

on:
  schedule:
    - cron: "17 4 * * *"   # hver natt ca. kl 06 norsk tid
  workflow_dispatch:        # "Run workflow"-knapp under Actions
  push:
    branches: [main]        # også når koden eller config.yaml endres

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true  # en ny kjøring erstatter en som henger i kø

jobs:
  # Én jobb på én maskin: hent → bygg → publiser.
  # (To jobber betydde to ganger venting på ledig maskin hos GitHub.)
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 1) Hent stillinger → frontend/public/jobs.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/main.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NAV_TOKEN: ${{ secrets.NAV_TOKEN }}

      # 2) Bygg nettsiden
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        working-directory: frontend

      # 3) Publiser til GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4